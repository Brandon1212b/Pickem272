    <!-- Keep navigation inside the standalone web app (prevents Safari chrome / X bar) -->
    <script>
      (function () {
        var isStandalone =
          window.navigator.standalone === true ||
          window.matchMedia("(display-mode: standalone)").matches;

        if (!isStandalone) return;

        document.addEventListener(
          "click",
          function (e) {
            var el = e.target;
            while (el && el.nodeName !== "A" && el.nodeName !== "HTML") {
              el = el.parentNode;
            }
            if (!el || el.nodeName !== "A" || !el.href) return;

            // Only intercept same-origin links that would otherwise open externally
            try {
              var url = new URL(el.href, window.location.href);
              if (url.origin === window.location.origin && !el.target) {
                e.preventDefault();
                window.location.href = url.href;
              }
            } catch (_) {}
          },
          true
        );
      })();
    </script>
